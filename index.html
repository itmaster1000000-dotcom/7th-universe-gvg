<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>7TH UNIVERSE — FIRST BRANCH — GUILD VS GUILD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 10% 10%, #1769ff33, transparent 30%),
        radial-gradient(circle at 90% 10%, #ff207733, transparent 30%),
        radial-gradient(circle at 50% 100%, #7b2cff22, transparent 35%),
        #05060b;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .box {
      width: 100%;
      padding: 30px;
      border: 1px solid #ffffff18;
      border-radius: 25px;
      background: #0d1019ee;
      box-shadow: 0 25px 70px #0009;
      backdrop-filter: blur(14px);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 900;
      letter-spacing: 3px;
      margin: 0;
      background: linear-gradient(90deg, #ffffff, #58a6ff, #ff4f91);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      margin-top: 8px;
      color: #aab2c5;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 700;
    }

    .branch {
      margin-top: 22px;
      font-size: 25px;
      font-weight: 900;
      text-align: center;
    }

    .gvg {
      margin-top: 6px;
      color: #58a6ff;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
    }

    .status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 13px;
      background: #ffffff08;
      border: 1px solid #ffffff12;
      color: #b8c1d4;
      font-size: 13px;
      text-align: center;
    }

    .success {
      color: #52e39a;
      border-color: #52e39a30;
      background: #52e39a0c;
    }

    .error {
      color: #ff7d87;
      border-color: #ff596430;
      background: #ff59640c;
    }

    .section {
      margin-top: 25px;
      padding: 22px;
      border-radius: 20px;
      background: #ffffff05;
      border: 1px solid #ffffff10;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #dbe2f0;
      font-size: 13px;
      font-weight: 800;
    }

    input[type="text"],
    input[type="tel"],
    input[type="time"] {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ffffff15;
      border-radius: 12px;
      outline: none;
      color: #fff;
      background: #080b12;
      font-size: 14px;
    }

    input:focus {
      border-color: #58a6ff88;
      box-shadow: 0 0 0 3px #58a6ff14;
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .skill-option {
      position: relative;
    }

    .skill-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .skill-option span {
      display: block;
      text-align: center;
      padding: 13px 8px;
      border-radius: 12px;
      border: 1px solid #ffffff14;
      background: #080b12;
      color: #bfc8db;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .skill-option input:checked + span {
      color: #fff;
      border-color: #58a6ff;
      background: linear-gradient(135deg, #1769ff33, #ff207722);
      box-shadow: 0 0 18px #58a6ff16;
    }

    .hint {
      margin-top: 8px;
      color: #737e95;
      font-size: 11px;
    }

    button {
      width: 100%;
      margin-top: 5px;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.7px;
      background: linear-gradient(100deg, #318dff, #ff2f78);
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    #formMessage {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
    }

    .challenge-card {
      margin-top: 14px;
      padding: 18px;
      border-radius: 17px;
      background: #080b12;
      border: 1px solid #ffffff12;
    }

    .challenge-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .challenge-card-header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .challenge-status {
      padding: 6px 9px;
      border-radius: 8px;
      background: #52e39a14;
      color: #52e39a;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .challenge-card-info {
      margin-top: 14px;
    }

    .challenge-card-info p {
      margin: 8px 0;
      color: #aeb8cc;
      font-size: 13px;
    }

    .challenge-card-info strong {
      color: #fff;
    }

    .challenge-contact-btn {
      display: block;
      margin-top: 15px;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 11px;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      background: #ffffff0d;
      border: 1px solid #ffffff12;
    }

    .challenge-contact-btn:hover {
      background: #ffffff14;
    }

    .loading,
    .empty-state {
      padding: 22px;
      text-align: center;
      color: #737e95;
      font-size: 13px;
    }

    .small {
      margin-top: 25px;
      color: #68728a;
      font-size: 10px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .box {
        padding: 20px;
        border-radius: 20px;
      }

      .skills {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box">

      <!-- HEADER -->
      <div class="header">

        <h1 class="title">7TH UNIVERSE</h1>

        <div class="sub">
          FIRST BRANCH
        </div>

        <div class="branch">
          GUILD VS GUILD
        </div>

        <div class="gvg">
          CHALLENGE CONTROL SYSTEM
        </div>

      </div>


      <!-- SUPABASE STATUS -->
      <div id="status" class="status">
        Checking Supabase connection...
      </div>


      <!-- CHALLENGE FORM -->
      <div class="section">

        <h2 class="section-title">
          CREATE CHALLENGE
        </h2>

        <form id="challengeForm">

          <!-- GUILD NAME -->
          <div class="field">

            <label for="guildName">
              GUILD NAME
            </label>

            <input
              type="text"
              id="guildName"
              name="guildName"
              placeholder="Enter your guild name"
              autocomplete="off"
              required
            >

          </div>


          <!-- TIME -->
          <div class="field">

            <label for="matchTime">
              MATCH TIME
            </label>

            <input
              type="time"
              id="matchTime"
              name="matchTime"
              required
            >

          </div>


          <!-- ACTIVE SKILLS -->
          <div class="field">

            <label>
              ACTIVE SKILLS
            </label>

            <div class="skills">

              <label class="skill-option">
                <input
                  type="checkbox"
                  name="skills"
                  value="DJ Alok"
                >
                <span>DJ ALOK</span>
              </label>

              <label class="skill-option">
                <input
                  type="checkbox"
                  name="skills"
                  value="Tatsuya"
                >
                <span>TATSUYA</span>
              </label>

              <label class="skill-option">
                <input
                  type="checkbox"
                  name="skills"
                  value="Koda"
                >
                <span>KODA</span>
              </label>

            </div>

            <div class="hint">
              Select none, one, two, or all three skills.
            </div>

          </div>


          <!-- CONTACT -->
          <div class="field">

            <label for="contact">
              CONTACT NUMBER
            </label>

            <input
              type="tel"
              id="contact"
              name="contact"
              placeholder="03XXXXXXXXX"
              autocomplete="tel"
              required
            >

          </div>


          <!-- SUBMIT -->
          <button
            type="submit"
            id="confirmChallenge"
          >
            CONFIRM CHALLENGE
          </button>

          <div id="formMessage"></div>

        </form>

      </div>


      <!-- LIVE CHALLENGES -->
      <div class="section">

        <h2 class="section-title">
          LIVE CHALLENGES
        </h2>

        <div id="challengeList">

          <div class="loading">
            Loading challenges...
          </div>

        </div>

      </div>


      <div class="small">
        7TH UNIVERSE • FIRST BRANCH • GVG
      </div>

    </div>

  </div>


  <!-- SUPABASE CONFIG -->
  <script>

    const SUPABASE_URL =
      "https://ypnpeiglbiycbexpeibb.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_5ei0IhM1tQ15u5pAIIavhQ_alE9O3bl";

    window.SUPABASE_URL = SUPABASE_URL;
    window.SUPABASE_ANON_KEY = SUPABASE_ANON_KEY;

    window.supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    async function testSupabase() {

      const statusBox =
        document.getElementById("status");

      try {

        const { error } =
          await window.supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        statusBox.textContent =
          "✅ SUPABASE CONNECTED SUCCESSFULLY";

        statusBox.className =
          "status success";

      } catch (error) {

        statusBox.textContent =
          "❌ CONNECTION ERROR: " +
          (error?.message || "Unknown error");

        statusBox.className =
          "status error";

      }

    }


    testSupabase();

  </script>


  <!-- MAIN WEBSITE LOGIC -->
  <script src="script.js"></script>

</body>
              </html>
